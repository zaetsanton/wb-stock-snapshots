name: WB Stock Snapshot

on:
  schedule:
    # Запуск каждые 30 минут
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Ручной запуск из интерфейса GitHub

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stock snapshot
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          OUTPUT_DIR: Данные/Индекс Локализации/История остатков WB/snapshots
        run: |
          python3 commands/bin/wb_snapshot_standalone.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Данные/ || true
          git diff --cached --quiet || git commit -m "WB stock snapshot $(date -u +%Y-%m-%d-%H%M)"
          git push
